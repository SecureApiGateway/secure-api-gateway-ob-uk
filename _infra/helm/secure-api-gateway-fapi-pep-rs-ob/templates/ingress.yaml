{{- if eq (lower .Values.resourceServer.fqdn) (lower .Values.resourceServer.mtlsFqdn) }}
{{- fail "resourceServer.fqdn and resourceServer.mtlsFqdn must differ: FAPI mTLS-only endpoints are enforced per-host" }}
{{- end }}
---
# Ingress for routes requiring MTLS with Open Banking Directory issued certs
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ .Release.Namespace }}/{{ .Values.ingress.mtls.clientCaSecret }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional_no_ca"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffers: "4 256k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    nginx.ingress.kubernetes.io/error-log-level: "debug"
  name: {{ .Chart.Name }}-mtls
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.resourceServer.mtlsFqdn }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: 80
            path: /rs/
            pathType: Prefix
  tls:
    - hosts:
        - {{ .Values.resourceServer.mtlsFqdn }}
      secretName: {{ .Values.ingress.mtls.serverCertSecret }}
---
# Plain-TLS ingress for the non-FAPI endpoints. Only endpoints that never
# consume the client TLS certificate are allow-listed here: the RCS consent
# UI (the browser flow AM's RemoteConsent agent redirects the PSU to) and the
# RCS API. The FAPI endpoints that consume the client TLS certificate (the
# /rs/open-banking/... account, payment and funds-confirmation routes) are
# only served through the mTLS ingress, which overwrites ssl-client-cert from
# the TLS handshake. Anything not listed falls through to the default backend
# (404), so future cert-consuming routes can never become reachable here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffers: "4 256k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    nginx.ingress.kubernetes.io/error-log-level: "debug"
  name: {{ .Chart.Name }}-tls
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.resourceServer.fqdn }}
      http:
        paths:
          # PSU browser consent flow (AM RemoteConsent redirect target)
          - backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: 80
            path: /rcs/ui/
            pathType: Prefix
          # RCS consent API (consent details/decision)
          - backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: 80
            path: /rcs/api/
            pathType: Prefix
  tls:
    - hosts:
        - {{ .Values.resourceServer.fqdn }}
      secretName: {{ .Values.ingress.tls.serverCertSecret }}
